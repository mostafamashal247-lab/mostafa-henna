<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوة حنة مصطفى</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Tahoma',sans-serif;
}

body{
background:#0f0f0f;
background-image:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
linear-gradient(135deg,#111,#1b1b1b);
color:white;
display:flex;
justify-content:center;
padding:30px;
}

.card{
max-width:420px;
width:100%;
background:#171717;
border:2px solid #c8a75d;
border-radius:25px;
padding:30px;
box-shadow:0 0 30px rgba(212,175,55,.35);
text-align:center;
}

h1{
color:#d4af37;
font-size:38px;
margin-bottom:10px;
}

h2{
color:#fff;
font-size:23px;
margin-bottom:25px;
font-weight:normal;
}

.line{
width:90px;
height:2px;
background:#d4af37;
margin:18px auto;
}

.box{
background:#222;
border-radius:18px;
padding:16px;
margin:15px 0;
border:1px solid rgba(212,175,55,.4);
}

.title{
color:#d4af37;
font-size:20px;
margin-bottom:8px;
}

.value{
font-size:19px;
line-height:1.8;
}

.location-btn{
display:inline-block;
margin-top:25px;
background:#d4af37;
color:#111;
padding:15px 28px;
text-decoration:none;
border-radius:35px;
font-weight:bold;
font-size:18px;
transition:.3s;
}

.location-btn:hover{
transform:scale(1.05);
}

.footer{
margin-top:30px;
color:#d4af37;
font-size:18px;
}

.small{
margin-top:8px;
font-size:15px;
color:#ddd;
}
</style>

</head>

<body>

<div class="card">

<h1>دعوة حنة</h1>

<h2>يشرفنا حضوركم</h2>

<div class="line"></div>

<div class="box">
<div class="title">👤 العريس</div>
<div class="value">مصطفى</div>
</div>

<div class="box">
<div class="title">📅 التاريخ</div>
<div class="value">
21 / 08 / 2026
</div>
</div>
</div>

<div class="box">
<div class="title">🕌 الموعد</div>
<div class="value">
الغداء من بعد صلاة الجمعة<br><br>
🌙 السهرة طول الليل
</div>
</div>

<div class="box">
<div class="title">📍 المكان</div>
<div class="value">
أمام منزل العريس
</div>
</div>

<a class="location-btn"
href="https://maps.app.goo.gl/sQXSTowdUFb9ipzVA"
target="_blank">
📍 اضغط هنا لفتح اللوكيشن
</a>

<div class="line"></div>

<div class="footer">
💛 نتشرف بحضوركم ومشاركتكم فرحتنا 💛
</div>

<div class="small">
مع خالص التقدير والاحترام
</div>

</div>

</body>
</html>
